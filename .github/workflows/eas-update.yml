name: Publish to Expo Go

# Publishes the app to EAS Update, which Expo hosts and serves with the
# manifest headers Expo Go requires. The published update opens in Expo Go
# from a permanent URL — no dev server, no tunnel, nothing running locally.
#
# Needs one repository secret: EXPO_TOKEN
#   https://expo.dev/settings/access-tokens -> create token
#   repo Settings -> Secrets and variables -> Actions -> New repository secret

on:
  workflow_dispatch:
    inputs:
      branch:
        description: EAS Update branch to publish to
        required: false
        default: main

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check the token is present
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set. Create one at"
            echo "::error::https://expo.dev/settings/access-tokens and add it under"
            echo "::error::Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Who am I
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Publish update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update \
            --branch "${{ inputs.branch }}" \
            --message "Published from GitHub Actions" \
            --non-interactive 2>&1 | tee update.log

      - name: Link a channel to the branch
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          # `eas update` creates a branch; Expo Go resolves updates through a
          # channel, so the channel has to exist and point at that branch.
          BRANCH="${{ inputs.branch }}"
          eas channel:create "$BRANCH" --non-interactive \
            || eas channel:edit "$BRANCH" --branch "$BRANCH" --non-interactive \
            || true
          eas channel:view "$BRANCH" --non-interactive || true

      - name: Verify what Expo Go will fetch
        run: |
          PROJECT_ID=$(node -p "require('./app.json').expo.extra.eas.projectId")
          GROUP=$(grep -E 'Update group ID' update.log | grep -oE '[0-9a-f-]{36}' | head -1)
          echo "PROJECT_ID=$PROJECT_ID"
          echo "GROUP=$GROUP"

          check() {
            echo ""
            echo "### $1"
            code=$(curl -sS -o body.json -w '%{http_code}' -D headers.txt --max-time 40 \
              -H 'expo-platform: ios' \
              -H 'expo-runtime-version: exposdk:57.0.0' \
              -H 'expo-protocol-version: 1' \
              -H 'expo-api-version: 1' \
              -H 'expo-updates-environment: EXPO_GO' \
              -H 'accept: multipart/mixed,application/expo+json,application/json' \
              "$1") || true
            echo "http=$code"
            grep -iE '^expo-protocol-version|^expo-sfv-version|^content-type' headers.txt || true
            head -c 300 body.json; echo
          }

          check "https://u.expo.dev/$PROJECT_ID?channel-name=${{ inputs.branch }}"
          check "https://u.expo.dev/update/$GROUP"

          if ! grep -qi '^expo-protocol-version' headers.txt; then
            # headers.txt holds the last check; re-test the channel URL alone.
            check "https://u.expo.dev/$PROJECT_ID?channel-name=${{ inputs.branch }}"
            grep -qi '^expo-protocol-version' headers.txt || {
              echo "::error::No Expo Go-loadable manifest yet — see the checks above."
              exit 1
            }
          fi

          echo ""
          echo "=================================================="
          echo "EXPO_GO_UPDATE_URL=exp://u.expo.dev/update/$GROUP"
          echo "EXPO_GO_CHANNEL_URL=exp://u.expo.dev/$PROJECT_ID?channel-name=${{ inputs.branch }}"
          echo "=================================================="
          echo "--- full eas update output ---"
          cat update.log
