kind = "mobile"
previewPath = "/file-manager-ios/"
title = "File Manager iOS"
description = "A premium local-first iOS file manager that makes files easy to find, organize, preview, and act on with a bright visual interface and fast everyday workflows."
version = "1.0.0"
id = "artifacts/file-manager-ios"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/file-manager-ios/" ]
localPort = 23372

[services.development]
run = "pnpm --filter @workspace/file-manager-ios run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/file-manager-ios", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/file-manager-ios", "run", "serve" ]

[services.env]
PORT = "23372"
BASE_PATH = "/file-manager-ios/"
